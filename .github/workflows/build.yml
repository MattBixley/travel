name: Build travel site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write        # so the build can commit newly geocoded places.yaml
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - run: pip install pyyaml

      # Catches the mistakes that break the build outright: unparseable YAML, a
      # tz abbreviation ZoneInfo can't load, a malformed date. Also warns about
      # locations with no coordinates and about sections with no dedicated
      # handling, without failing for either.
      - name: Validate trip YAML
        run: python scripts/validate_trips.py

      # Look up any place that isn't in places.yaml yet, so a new booking appears
      # on the map from a plain push — no local step. Only uncached names are
      # requested, so this is usually a no-op. Never fails the build: if the
      # geocoder is unreachable the place is simply left off the map and reported.
      - name: Look up coordinates for new places
        continue-on-error: true
        run: python scripts/geocode.py

      # Keep what we learned, so the next build doesn't ask again. Pushes made
      # with GITHUB_TOKEN don't retrigger this workflow, so there's no loop.
      - name: Save the coordinate cache
        continue-on-error: true
        run: |
          if git diff --quiet -- places.yaml; then
            echo "places.yaml unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add places.yaml
          git commit -m "chore: cache coordinates for new places"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Build the site
        run: python generate.py

      # The map is JavaScript, so valid HTML proves nothing about it — every
      # marker once failed to draw on markup that was perfectly well formed.
      # Load each page in a real browser and check the shapes actually rendered.
      - name: Install headless browser
        run: npm install --no-save puppeteer@24
      - name: Check the maps render
        run: node scripts/render_check.js

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
